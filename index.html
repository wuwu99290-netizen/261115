<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>破晓战纪：苍穹英雄录 | 6v6 热血漫画策略RPG</title>
<style>
:root{
  --bg:#0b0b0f;
  --panel:#16161e;
  --panel2:#1f1f2b;
  --yellow:#ffd600;
  --red:#e51a2e;
  --cyan:#00e5ff;
  --green:#00e676;
  --purple:#b388ff;
  --orange:#ff9100;
  --ink:#050507;
  --text:#f5f5f7;
  --muted:#a1a1b5;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;user-select:none}
.halftone{
  background-image:radial-gradient(rgba(255,214,0,0.08) 1.5px,transparent 1.5px),radial-gradient(rgba(229,26,46,0.06) 1.5px,transparent 1.5px);
  background-size:14px 14px;
  background-position:0 0,7px 7px;
}
.comic-box{
  background:var(--panel);
  border:3px solid var(--ink);
  box-shadow:5px 5px 0 var(--ink);
  position:relative;
}
.comic-btn{
  background:var(--yellow);
  color:var(--ink);
  border:3px solid var(--ink);
  box-shadow:3px 3px 0 var(--ink);
  font-weight:900;
  padding:6px 12px;
  cursor:pointer;
  font-size:12px;
  letter-spacing:.4px;
  transition:transform .08s,box-shadow .08s,background .12s;
  display:inline-flex;align-items:center;justify-content:center;gap:4px;white-space:nowrap;
}
.comic-btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink);background:#ffe44d}
.comic-btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.comic-btn.red{background:var(--red);color:#fff}
.comic-btn.red:hover{background:#ff2e43}
.comic-btn.dark{background:var(--panel2);color:var(--text)}
.comic-btn.dark:hover{background:#2d2d3d}
.comic-btn.cyan{background:var(--cyan);color:var(--ink)}
.comic-btn.purple{background:var(--purple);color:var(--ink)}
.comic-btn:disabled{opacity:.42;cursor:not-allowed;transform:none;box-shadow:2px 2px 0 var(--ink)}

#app{display:flex;flex-direction:column;height:100%;width:100%;overflow:hidden}
#topbar{
  height:52px;flex-shrink:0;background:linear-gradient(90deg,#121218,#1d1418);
  border-bottom:3px solid var(--yellow);display:flex;align-items:center;gap:6px;padding:0 8px;z-index:20;overflow-x:auto;
}
#topbar::-webkit-scrollbar{display:none}
.brand-tag{
  background:var(--red);color:#fff;font-weight:900;font-size:13px;padding:4px 10px;
  border:2px solid var(--ink);box-shadow:2px 2px 0 var(--ink);transform:skewX(-8deg);white-space:nowrap;flex-shrink:0;
}
.brand-tag span{display:inline-block;transform:skewX(8deg)}
.res-pill{
  background:#1f1f2b;border:2px solid var(--ink);padding:3px 8px;font-size:11px;font-weight:800;
  display:flex;align-items:center;gap:3px;white-space:nowrap;flex-shrink:0;box-shadow:2px 2px 0 var(--ink);
}
.res-pill b{color:var(--yellow)}
.nav-spacer{flex:1;min-width:4px}

#stage{flex:1;position:relative;min-height:0;overflow:hidden;display:flex;flex-direction:column}
#cityView{position:relative;width:100%;height:100%;display:flex;flex-direction:column}
#cityCanvas{width:100%;height:100%;display:block;touch-action:none;cursor:pointer}
.city-hud-top{
  position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;gap:8px;flex-wrap:wrap;
}
.city-hud-top > *{pointer-events:auto}
.lead-card{
  background:rgba(16,16,24,0.92);border:3px solid var(--yellow);box-shadow:4px 4px 0 var(--ink);
  padding:6px 10px;display:flex;align-items:center;gap:8px;cursor:pointer;
}
.lead-card img{width:38px;height:38px;object-fit:cover;border:2px solid var(--ink);border-radius:4px}
.city-quick-bar{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.interact-prompt{
  position:absolute;bottom:20px;left:50%;transform:translateX(-50%);
  background:var(--yellow);color:var(--ink);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);
  padding:8px 18px;font-weight:900;font-size:14px;cursor:pointer;display:none;z-index:15;
  animation:popPulse 1s infinite alternate;
}
@keyframes popPulse{from{transform:translateX(-50%) scale(1)}to{transform:translateX(-50%) scale(1.05)}}

#mobileDpad{
  position:absolute;bottom:16px;left:16px;width:126px;height:126px;display:none;z-index:14;opacity:.85;
}
@media (pointer:coarse),(max-width:820px){#mobileDpad{display:block}}
.dpad-btn{
  position:absolute;width:40px;height:40px;background:rgba(22,22,30,0.9);border:2px solid var(--yellow);
  color:var(--yellow);font-weight:900;font-size:16px;display:flex;align-items:center;justify-content:center;border-radius:6px;
}
.dpad-btn:active{background:var(--yellow);color:var(--ink)}
.dpad-up{top:0;left:43px}.dpad-down{bottom:0;left:43px}.dpad-left{top:43px;left:0}.dpad-right{top:43px;right:0}

/* 6V6 BATTLE VIEW */
#battleView{
  position:absolute;inset:0;display:none;flex-direction:column;background:radial-gradient(circle at 50% 30%,#271521,#0b0b0f 75%);
  z-index:25;overflow:hidden;
}
#battleVfxCanvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}
.battle-header{
  padding:6px 10px;background:rgba(11,11,15,0.94);border-bottom:3px solid var(--red);
  display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;z-index:28;
}
.threat-badge{
  background:var(--red);color:#fff;border:2px solid var(--ink);padding:3px 10px;font-weight:900;font-size:12px;
  transform:skewX(-8deg);box-shadow:2px 2px 0 var(--ink);
}
.saitama-wrap{flex:1;min-width:170px;max-width:380px;display:flex;align-items:center;gap:6px}
.saitama-bar-bg{
  flex:1;height:16px;background:#1a1a24;border:2px solid var(--ink);position:relative;overflow:hidden;
}
.saitama-bar-fill{height:100%;width:0%;background:linear-gradient(90deg,#ff9100,#ffd600,#fff);transition:width .35s}
.saitama-bar-txt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;color:#fff;text-shadow:1px 1px 0 #000}

.bond-strip{
  display:flex;gap:6px;padding:4px 10px;background:rgba(18,18,28,0.9);border-bottom:2px solid var(--ink);
  overflow-x:auto;z-index:28;font-size:11px;
}
.bond-pill{
  background:#222233;border:1.5px solid var(--yellow);color:var(--yellow);padding:2px 8px;font-weight:800;white-space:nowrap;
}

.battle-arena-6v6{
  flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:10px;align-items:center;position:relative;z-index:27;overflow-y:auto;
}
@media(max-width:860px){
  .battle-arena-6v6{grid-template-columns:1fr;gap:10px}
}
.side-grid-wrap{display:flex;flex-direction:column;gap:4px}
.side-label{font-size:11px;font-weight:900;color:var(--yellow);display:flex;justify-content:space-between}
.formation-6{
  display:grid;grid-template-columns:1fr 1fr;gap:8px;
}
.row-col{display:flex;flex-direction:column;gap:6px}
.row-title{font-size:10px;font-weight:900;color:var(--muted);text-align:center;background:#101018;padding:2px;border:1px solid #2b2b3d}
.unit-6{
  background:var(--panel);border:2.5px solid var(--ink);box-shadow:3px 3px 0 var(--ink);
  display:flex;align-items:center;gap:6px;padding:5px;position:relative;transition:transform .12s,border-color .12s;min-height:68px;
}
.unit-6.active-turn{border-color:var(--yellow);box-shadow:0 0 14px rgba(255,214,0,0.55),3px 3px 0 var(--ink);transform:scale(1.03)}
.unit-6.dead{opacity:.35;filter:grayscale(1)}
.unit-6.hit-flash{filter:brightness(2.8);transform:translateX(4px)}
.unit-6.boss-unit{border-color:var(--red);background:linear-gradient(135deg,#2a1018,#16121b)}
.unit-6 img,.unit-6 .svg-thumb{width:46px;height:56px;object-fit:cover;border:2px solid var(--ink);flex-shrink:0;background:#0d0d14}
.unit-6-info{flex:1;min-width:0}
.unit-6-name{font-size:11px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hp-bar{height:8px;background:#25161b;border:1.5px solid var(--ink);margin-top:3px;position:relative;overflow:hidden}
.hp-fill{height:100%;background:linear-gradient(90deg,#00c853,#69f0ae);transition:width .25s}
.hp-fill.enemy{background:linear-gradient(90deg,#b71c1c,#ff1744)}
.shield-fill{position:absolute;top:0;left:0;height:100%;background:rgba(0,229,255,0.6);transition:width .25s}
.unit-6-sub{font-size:10px;color:var(--muted);display:flex;justify-content:space-between;margin-top:2px}

.battle-footer{
  background:rgba(12,12,18,0.96);border-top:3px solid var(--ink);padding:8px 10px;display:flex;flex-direction:column;gap:6px;z-index:28;
}
.energy-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.energy-orbs{display:flex;gap:4px;flex-wrap:wrap}
.orb{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink);background:#252533;transition:all .2s}
.orb.on{background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
.skills-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(max-width:600px){.skills-row{grid-template-columns:1fr}}
.skill-btn{
  background:var(--panel2);color:var(--text);border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);
  padding:6px 9px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;
}
.skill-btn:hover:not(:disabled){background:#2d2d3f}
.skill-btn:disabled{opacity:.42;cursor:not-allowed}
.skill-btn.ult{background:linear-gradient(135deg,#3d1018,#241226);border-color:var(--red)}
.skill-head{display:flex;justify-content:space-between;font-weight:900;font-size:12px}
.skill-cost{color:var(--yellow);font-size:11px}
.skill-desc{font-size:10px;color:var(--muted)}
.battle-log{
  height:46px;background:#07070b;border:2px solid #262636;padding:4px 8px;overflow-y:auto;font-size:11px;line-height:1.4;color:#c9c9d8;
}

/* CUT-IN OVERLAY */
#cutinOverlay{
  position:fixed;inset:0;background:rgba(0,0,0,0.88);z-index:100;display:none;align-items:center;justify-content:center;
  overflow:hidden;pointer-events:none;
}
.cutin-strip{
  width:110%;background:linear-gradient(90deg,var(--red),#ff6d00,var(--yellow));
  border-top:5px solid #fff;border-bottom:5px solid #fff;transform:skewY(-5deg);
  display:flex;align-items:center;justify-content:center;gap:24px;padding:18px 24px;
  box-shadow:0 0 60px rgba(255,214,0,0.8);animation:cutinSlide .85s cubic-bezier(.16,1,.3,1);
}
@keyframes cutinSlide{0%{transform:translateX(-100%) skewY(-5deg)}20%{transform:translateX(0) skewY(-5deg)}85%{transform:translateX(0) skewY(-5deg)}100%{transform:translateX(100%) skewY(-5deg)}}
.cutin-strip img{height:160px;width:120px;object-fit:cover;border:4px solid var(--ink);box-shadow:6px 6px 0 var(--ink)}
.cutin-text{color:var(--ink);font-weight:900;text-shadow:2px 2px 0 #fff}
.cutin-quote{font-size:clamp(22px,4.5vw,40px);font-style:italic;letter-spacing:2px}
.cutin-sub{font-size:13px;background:var(--ink);color:var(--yellow);display:inline-block;padding:2px 10px;margin-bottom:6px}

.shake{animation:shakeAnim .35s ease-in-out}
@keyframes shakeAnim{
  0%,100%{transform:translate(0,0)}20%{transform:translate(-8px,5px)}40%{transform:translate(8px,-5px)}60%{transform:translate(-5px,-4px)}80%{transform:translate(5px,4px)}
}
.dmg-float{
  position:fixed;font-weight:900;font-size:20px;color:#fff;text-shadow:2px 2px 0 #000,-2px -2px 0 #000;
  pointer-events:none;z-index:90;animation:dmgUp .85s forwards;
}
.dmg-float.crit{color:var(--yellow);font-size:28px;text-shadow:3px 3px 0 var(--red),-2px -2px 0 #000}
@keyframes dmgUp{0%{opacity:1;transform:translate(-50%,0) scale(.8)}25%{transform:translate(-50%,-20px) scale(1.2)}100%{opacity:0;transform:translate(-50%,-56px) scale(.95)}}

/* MODALS */
.modal-backdrop{
  position:fixed;inset:0;background:rgba(5,5,9,0.84);z-index:60;display:none;align-items:center;justify-content:center;padding:10px;
}
.modal-backdrop.open{display:flex}
.modal-card{
  width:100%;max-width:960px;max-height:92vh;background:var(--panel);border:4px solid var(--ink);
  box-shadow:8px 8px 0 var(--ink);display:flex;flex-direction:column;overflow:hidden;
}
.modal-head{
  padding:10px 14px;background:linear-gradient(90deg,var(--red),#8e0e1c);border-bottom:3px solid var(--ink);
  display:flex;align-items:center;justify-content:space-between;gap:8px;
}
.modal-head h2{font-size:15px;font-weight:900;color:#fff;letter-spacing:1px}
.modal-body{padding:12px;overflow-y:auto;flex:1}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tab-btn{
  background:var(--panel2);color:var(--muted);border:2px solid var(--ink);padding:5px 11px;font-weight:800;cursor:pointer;font-size:12px;
}
.tab-btn.active{background:var(--yellow);color:var(--ink)}
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:9px}
.item-card{
  background:var(--panel2);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:9px;display:flex;flex-direction:column;gap:5px;
}
.item-card.ur{border-color:#ff3d00;background:linear-gradient(160deg,#2a161b,#1d1927)}
.item-card.ssr{border-color:var(--yellow)}
.item-card.sr{border-color:var(--purple)}
.item-card-top{display:flex;gap:8px;align-items:center}
.item-card-top img{width:52px;height:68px;object-fit:cover;border:2px solid var(--ink);flex-shrink:0}
.tag{display:inline-block;padding:1px 6px;font-size:10px;font-weight:900;border:1px solid var(--ink);background:#2d2d3d;color:#fff}
.tag.ur{background:linear-gradient(90deg,#ff3d00,#ffd600);color:#000}
.tag.ssr{background:var(--yellow);color:var(--ink)}
.tag.sr{background:var(--purple);color:var(--ink)}
.tag.r{background:#4fc3f7;color:var(--ink)}

/* FORMATION SLOTS */
.form-board{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
@media(max-width:650px){.form-board{grid-template-columns:1fr}}
.form-col{background:#12121a;border:2px solid var(--ink);padding:8px}
.form-slot{
  display:flex;align-items:center;gap:8px;padding:6px;margin-top:6px;background:#1e1e2b;border:2px dashed #444;cursor:pointer;
}
.form-slot.selected{border:2px solid var(--yellow);background:#2c2614}
.form-slot img{width:40px;height:50px;object-fit:cover;border:2px solid #000}

#toastBox{position:fixed;top:60px;right:12px;z-index:120;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.toast{
  background:var(--yellow);color:var(--ink);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);
  padding:7px 12px;font-weight:900;font-size:12px;animation:fadeSlide .25s ease;
}
@keyframes fadeSlide{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}

#gachaAnimOverlay{
  position:fixed;inset:0;background:#04040a;z-index:110;display:none;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;
}
#gachaAnimCanvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#gachaRevealBox{
  position:relative;z-index:112;display:none;flex-direction:column;align-items:center;gap:14px;padding:16px;max-width:92vw;max-height:88vh;overflow-y:auto;
}
.gacha-splash-card{
  background:linear-gradient(160deg,#1f1828,#0d0d14);border:4px solid var(--yellow);box-shadow:0 0 40px rgba(255,214,0,0.55),6px 6px 0 #000;
  padding:16px;text-align:center;max-width:300px;animation:popIn .35s cubic-bezier(.16,1,.3,1);
}
@keyframes popIn{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}

</style>
</head>
<body class="halftone">
<div id="app">
  <header id="topbar">
    <div class="brand-tag"><span>⚡ 破晓战纪 · 6v6 苍穹英雄录</span></div>
    <div class="res-pill" title="协会金币">🪙 <b id="resGold">0</b></div>
    <div class="res-pill" title="星穹钻石">💎 <b id="resDia">0</b></div>
    <div class="res-pill" title="常驻招募券">🎫 <b id="resStdTix">0</b></div>
    <div class="res-pill" title="限定UP券">🌟 <b id="resLimTix">0</b></div>
    <div class="res-pill" title="特训徽章">🏅 <b id="resExp">0</b></div>
    <div class="res-pill" title="竞技荣誉币">🎖️ <b id="resHonor">0</b></div>
    <div class="nav-spacer"></div>
    <button class="comic-btn dark" id="btnAudioToggle">🔊 音效</button>
    <button class="comic-btn dark" id="btnBounty">📋 赏金</button>
    <button class="comic-btn" id="btnGacha">🎰 招募(72人)</button>
    <button class="comic-btn dark" id="btnHeroes">🦸 布阵/养成</button>
    <button class="comic-btn dark" id="btnGear">⚔️ 专武/配饰</button>
    <button class="comic-btn red" id="btnArena">🏟️ 竞技场</button>
    <button class="comic-btn purple" id="btnAlliance">🏰 联盟</button>
    <button class="comic-btn cyan" id="btnRank">🏆 全服榜</button>
  </header>

  <main id="stage">
    <section id="cityView">
      <canvas id="cityCanvas"></canvas>
      <div class="city-hud-top">
        <div class="lead-card" id="btnSwitchLead" title="点击切换场上行走角色/阵型">
          <img id="leadAvatar" src="" alt="队长">
          <div>
            <div style="font-size:11px;color:var(--yellow);font-weight:900">苍穹都市巡逻队长 (点击布阵/切换)</div>
            <div id="leadName" style="font-size:13px;font-weight:900">苍穹破晓·凌风</div>
            <div id="stageProgressTxt" style="font-size:11px;color:var(--muted)">灾害进度: 狼级 · WASD/点击移动</div>
          </div>
        </div>
        <div class="city-quick-bar">
          <button class="comic-btn red" id="btnQuickBattle">⚔️ 6v6 迎战当前灾害</button>
        </div>
      </div>

      <button class="interact-prompt" id="btnCityInteract">按 [空格] 或点击交互</button>

      <div id="mobileDpad">
        <button class="dpad-btn dpad-up" data-dir="up">▲</button>
        <button class="dpad-btn dpad-down" data-dir="down">▼</button>
        <button class="dpad-btn dpad-left" data-dir="left">◀</button>
        <button class="dpad-btn dpad-right" data-dir="right">▶</button>
      </div>
    </section>

    <section id="battleView">
      <canvas id="battleVfxCanvas"></canvas>
      <div class="battle-header">
        <div class="threat-badge" id="battleThreatBadge">狼级灾害 · 6v6</div>
        <div class="saitama-wrap">
          <span style="font-size:11px;font-weight:900;color:var(--yellow);white-space:nowrap">⚡ 破晓降临</span>
          <div class="saitama-bar-bg">
            <div class="saitama-bar-fill" id="saitamaBarFill"></div>
            <div class="saitama-bar-txt" id="saitamaBarTxt">0%</div>
          </div>
          <button class="comic-btn red" id="btnSaitamaStrike" style="display:none;padding:3px 9px;font-size:11px">💥 破晓终焉一击!</button>
        </div>
        <button class="comic-btn dark" id="btnRetreat" style="padding:3px 9px;font-size:11px">🏃 撤回苍穹都市</button>
      </div>

      <div class="bond-strip" id="battleBondStrip"></div>

      <div class="battle-arena-6v6">
        <div class="side-grid-wrap">
          <div class="side-label"><span>🛡️ 我方 6v6 阵型 (后排受前排保护)</span><span id="allyPowerLbl"></span></div>
          <div class="formation-6">
            <div class="row-col"><div class="row-title">后排 (攻击+12%)</div><div id="allyBackCol" class="row-col"></div></div>
            <div class="row-col"><div class="row-title">前排 (减伤+15%)</div><div id="allyFrontCol" class="row-col"></div></div>
          </div>
        </div>
        <div class="side-grid-wrap">

  // Unique procedural anime-manga bust SVG generator for all 66+ additional heroes (zero duplicate images!)
  const svgCache = {};
  function genUniqueHeroSvg(hero){
    if(svgCache[hero.id]) return svgCache[hero.id];
    let h = 2166136261;
    for(let i=0;i<hero.id.length;i++){ h ^= hero.id.charCodeAt(i); h = Math.imul(h, 16777619); }
    const rnd = (n) => { h = Math.imul(h ^ (h >>> 15), 2246822519); return Math.abs(h) % n; };

    const bgPal = ['#1d1128','#0f1c2e','#261116','#12241c','#241e0d','#15192b'];
    const hairPal = ['#ffd600','#ff3d00','#00e5ff','#ff4081','#e0e0e0','#7c4dff','#00e676','#ff9100','#2979ff','#f50057'];
    const skinPal = ['#ffe0bd','#ffcd94','#f5cfa0','#e8b88a'];
    const bg = bgPal[rnd(bgPal.length)];
    const hair = hairPal[rnd(hairPal.length)];
    const skin = skinPal[rnd(skinPal.length)];
    const eyeCol = hero.color || '#ffd600';
    const hairStyle = rnd(5);
    const gearStyle = rnd(4);
    const scar = rnd(3) === 0;
    const halo = hero.rarity === 'UR' || hero.rarity === 'SSR';

    let hairPath = '';
    if(hairStyle===0) hairPath = `<path d="M22,42 L35,12 L52,26 L68,8 L84,26 L100,14 L98,48 Q60,34 22,42 Z" fill="${hair}" stroke="#000" stroke-width="3"/>`;
    else if(hairStyle===1) hairPath = `<path d="M24,52 Q24,14 60,12 Q96,14 96,52 L88,36 L60,28 L32,36 Z" fill="${hair}" stroke="#000" stroke-width="3"/>`;
    else if(hairStyle===2) hairPath = `<path d="M20,62 L28,18 L60,10 L92,18 L100,62 L84,42 L60,34 L36,42 Z" fill="${hair}" stroke="#000" stroke-width="3"/>`;
    else if(hairStyle===3) hairPath = `<path d="M26,46 C26,12 94,12 94,46 L102,88 L82,66 L60,32 L38,66 L18,88 Z" fill="${hair}" stroke="#000" stroke-width="3"/>`;
    else hairPath = `<path d="M25,45 L42,16 L60,24 L78,16 L95,45 L78,36 L60,42 L42,36 Z" fill="${hair}" stroke="#000" stroke-width="3"/>`;

    let gear = '';
    if(gearStyle===0) gear = `<rect x="36" y="47" width="48" height="11" rx="3" fill="${eyeCol}" opacity="0.85" stroke="#000" stroke-width="2.5"/>`;
    else if(gearStyle===1) gear = `<path d="M32,76 L60,88 L88,76 L80,102 L40,102 Z" fill="#111" stroke="${eyeCol}" stroke-width="2.5"/>`;
    else if(gearStyle===2) gear = `<path d="M26,22 L38,34 M94,22 L82,34" stroke="${eyeCol}" stroke-width="5" stroke-linecap="round"/>`;

    const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 150">
      <rect width="120" height="150" fill="${bg}"/>
      <path d="M0,150 L60,75 L120,150 Z" fill="${eyeCol}" opacity="0.16"/>
      ${halo?`<circle cx="60" cy="54" r="44" fill="none" stroke="${eyeCol}" stroke-width="3" stroke-dasharray="8 5" opacity="0.75"/>`:''}
      <path d="M18,150 L28,96 L60,88 L92,96 L102,150 Z" fill="${hero.color}" stroke="#000" stroke-width="3.5"/>
      <path d="M44,90 L60,122 L76,90" fill="#111" stroke="#000" stroke-width="2.5"/>
      <ellipse cx="60" cy="58" rx="26" ry="30" fill="${skin}" stroke="#000" stroke-width="3.5"/>
      <path d="M40,52 L54,55 L42,60 Z M80,52 L66,55 L78,60 Z" fill="${eyeCol}" stroke="#000" stroke-width="1.8"/>
      <path d="M51,73 Q60,78 69,73" stroke="#000" stroke-width="2.5" fill="none"/>
      ${scar?`<path d="M68,46 L76,66" stroke="#e51a2e" stroke-width="2.5"/>`:''}
      ${hairPath}
      ${gear}
      <text x="8" y="142" font-size="11" font-weight="900" fill="#ffd600" stroke="#000" stroke-width="0.6">${hero.rarity}</text>
    </svg>`;
    const url = 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
    svgCache[hero.id] = url;
    return url;
  }

  function getHeroPortrait(hero){
    return hero.aaa ? AAA_PORTRAITS[hero.aaa] : genUniqueHeroSvg(hero);
  }

  const AudioFX = (() => {
    let ctx = null, enabled = true;
    function ensure(){
      if(!enabled) return null;
      if(!ctx){ const AC = window.AudioContext || window.webkitAudioContext; if(AC) ctx = new AC(); }
      if(ctx && ctx.state==='suspended') ctx.resume().catch(()=>{});
      return ctx;
    }
    function tone(freq, dur, type='square', vol=0.11, slide=0){
      const c = ensure(); if(!c) return;
      const o = c.createOscillator(), g = c.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, c.currentTime);
      if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, slide), c.currentTime + dur);
      g.gain.setValueAtTime(vol, c.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + dur);
      o.connect(g); g.connect(c.destination);
      o.start(); o.stop(c.currentTime + dur);
    }
    return {
      isEnabled:()=>enabled,
      toggle:()=>{ enabled = !enabled; return enabled; },
      hit:()=>tone(180, 0.11, 'sawtooth', 0.14, 45),
      crit:()=>{ tone(420, 0.15, 'square', 0.16, 90); setTimeout(()=>tone(680, 0.16, 'sawtooth', 0.12, 160), 40); },
      ult:()=>{ tone(120, 0.42, 'sawtooth', 0.2, 520); setTimeout(()=>tone(80, 0.5, 'square', 0.18, 35), 160); },
      king:()=>{ for(let i=0;i<4;i++) setTimeout(()=>tone(58, 0.11, 'sine', 0.26, 36), i*135); },
      gacha:()=>{ [523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,0.16,'triangle',0.12), i*70)); },
      step:()=>tone(140, 0.04, 'triangle', 0.035, 80)
    };
  })();

      const d = HERO_MAP[id]; if(!d) return;
      facCounts[d.faction] = (facCounts[d.faction]||0)+1;
      clsCounts[d.cls] = (clsCounts[d.cls]||0)+1;
    });
    const active = [];
    let atkMult = 1 + (State.allianceTechLv * 0.04);
    let hpMult = 1 + (State.allianceTechLv * 0.04);
    let critAdd = 0, maxEnergyAdd = 0, saitamaSpeedAdd = 0;

    Object.entries(facCounts).forEach(([fac, cnt])=>{
      if(cnt >= 2){
        const bonus = cnt >= 4 ? 0.24 : 0.12;
        atkMult += bonus; hpMult += bonus*0.8;
        active.push({ name:`${fac}(${cnt}人)`, desc:`全队攻+${Math.round(bonus*100)}% 血+${Math.round(bonus*80)}%` });
      }
    });
    if((clsCounts['铁壁']||0) >= 2){ hpMult += 0.15; active.push({ name:`铁壁阵线(${clsCounts['铁壁']}人)`, desc:'全队生命+15%' }); }
    if((clsCounts['强攻']||0) >= 2){ atkMult += 0.15; active.push({ name:`强攻连携(${clsCounts['强攻']}人)`, desc:'全队攻击+15%' }); }
    if((clsCounts['异能']||0) >= 2){ critAdd += 12; maxEnergyAdd += 1; active.push({ name:`异能共振(${clsCounts['异能']}人)`, desc:'暴击+12% 能量上限+1' }); }
    if((clsCounts['疾风']||0) >= 2 || (clsCounts['辅助']||0) >= 2){ saitamaSpeedAdd += 0.22; active.push({ name:`疾风破晓`, desc:'破晓充能速度+22%' }); }

    return { active, atkMult, hpMult, critAdd, maxEnergyAdd, saitamaSpeedAdd };
  }

  function getHeroStats(heroId, bonds){
    const def = HERO_MAP[heroId];
    const h = State.heroes[heroId];
    if(!def || !h) return { hp:500, atk:50, def:20, crit:5, sigActive:false, power:200 };
    const lvMult = 1 + (h.level - 1) * 0.085;
    const starMult = 1 + (h.stars - 1) * 0.18;
    let hp = Math.round(def.baseHp * lvMult * starMult);
    let atk = Math.round(def.baseAtk * lvMult * starMult);
    let df = Math.round(def.baseDef * lvMult * starMult);
    let crit = def.crit;
    let sigActive = false;

    if(h.weaponId){
      const w = State.weapons.find(x=>x.uid===h.weaponId);
      if(w){
        const wd = WEAPON_DEFS[w.defId];
        const wMult = 1 + (w.level - 1)*0.12;
        atk += Math.round(wd.atk * wMult);
        hp += Math.round(wd.hp * wMult);
        if(wd.hero === heroId){ sigActive = true; if(heroId==='lim_silverflash') crit += 18; }
      }
    }
    [h.accCore, h.accCharm].forEach(aid=>{
      if(!aid) return;
      const acc = State.accessories.find(x=>x.uid===aid);
      if(acc){
        const aMult = 1 + (acc.level - 1)*0.15;
        atk += Math.round(acc.atk * aMult); hp += Math.round(acc.hp * aMult); crit += acc.crit;
      }
    });
    if(bonds){
      hp = Math.round(hp * bonds.hpMult);
      atk = Math.round(atk * bonds.atkMult);
      crit += bonds.critAdd;
    }
    return { hp, atk, def:df, crit, sigActive, power: Math.round(hp*0.38 + atk*3.1 + df*1.4 + crit*6) };
  }

  function getSquadPower(){
    const ids = getActiveSquadIds();
    const bonds = computeBonds(ids);
    return ids.reduce((s,id)=> s + getHeroStats(id, bonds).power, 0);
  }

  const City = (() => {
    const canvas = document.getElementById('cityCanvas');
    const ctx = canvas.getContext('2d');
    let W = 900, H = 560;
    const player = { x:450, y:300, targetX:null, targetY:null, speed:235, facing:1, stepTimer:0 };
    const keys = {};
    let activeZone = null;
    let crate = { x:520, y:390, active:true, respawnAt:0 };

    const zones = [
      { id:'gacha',    rx:0.16, ry:0.26, r:50, label:'🏛️ 英雄协会总部', sub:'招募72名英雄', color:'#ffd600', action:()=>openGachaModal('std') },
      { id:'heroes',   rx:0.16, ry:0.72, r:50, label:'🏋️ 特训与布阵', sub:'前后排6v6羁绊', color:'#00e5ff', action:()=>openHeroesModal() },
      { id:'gear',     rx:0.50, ry:0.20, r:48, label:'⚔️ 武装工坊', sub:'专武/配饰强化', color:'#ff9100', action:()=>openGearModal() },
      { id:'arena',    rx:0.50, ry:0.78, r:52, label:'🏟️ 巅峰竞技场', sub:'6v6 真人PvP场地', color:'#ff1744', action:()=>openArenaModal() },
      { id:'alliance', rx:0.84, ry:0.26, r:50, label:'🏰 英雄联盟基地', sub:'联盟科技/共斗', color:'#b388ff', action:()=>openAllianceModal() },
      { id:'rank',     rx:0.84, ry:0.52, r:46, label:'🏆 全服排行碑', sub:'Firebase实时榜', color:'#69f0ae', action:()=>openRankModal() },
      { id:'battle',   rx:0.84, ry:0.78, r:54, label:'👾 灾害前线区', sub:'6v6 爬塔挑战', color:'#e51a2e', action:()=>startBattle(State.highestWave, 'pve') }
    ];

    function resize(){
      const wrap = canvas.parentElement; if(!wrap) return;
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = wrap.clientWidth || 800; H = wrap.clientHeight || 500;
      canvas.width = W * dpr; canvas.height = H * dpr;
      ctx.setTransform(dpr,0,0,dpr,0,0);
      zones.forEach(z=>{ z.x = W*z.rx; z.y = H*z.ry; });
      player.x = Math.max(40, Math.min(W-40, player.x));
      player.y = Math.max(70, Math.min(H-40, player.y));
    }

    function update(dt){
      if(document.getElementById('battleView').style.display === 'flex') return;
      let dx = 0, dy = 0;
      if(keys['KeyW']||keys['ArrowUp']||keys['up']) dy -= 1;
      if(keys['KeyS']||keys['ArrowDown']||keys['down']) dy += 1;
      if(keys['KeyA']||keys['ArrowLeft']||keys['left']) dx -= 1;
      if(keys['KeyD']||keys['ArrowRight']||keys['right']) dx += 1;

      if(dx !== 0 || dy !== 0){
        player.targetX = null; player.targetY = null;
        const len = Math.hypot(dx, dy);
        player.x += (dx/len)*player.speed*dt; player.y += (dy/len)*player.speed*dt;
        if(dx !== 0) player.facing = dx > 0 ? 1 : -1;
        player.stepTimer += dt;
        if(player.stepTimer > 0.28){ AudioFX.step(); player.stepTimer = 0; }
      } else if(player.targetX !== null){
        const tx = player.targetX - player.x, ty = player.targetY - player.y;
        const dist = Math.hypot(tx, ty);
        if(dist < 8){ player.targetX = null; player.targetY = null; }
        else { player.x += (tx/dist)*player.speed*dt; player.y += (ty/dist)*player.speed*dt; if(Math.abs(tx)>2) player.facing = tx>0?1:-1; }
      }
      player.x = Math.max(32, Math.min(W-32, player.x));
      player.y = Math.max(74, Math.min(H-32, player.y));

      if(crate.active && Math.hypot(player.x-crate.x, player.y-crate.y) < 34){
        crate.active = false; crate.respawnAt = Date.now() + 38000;
        const roll = Math.random();
        if(roll < 0.45){
          const g = 25 + Math.floor(Math.random()*31);
          State.gold += g; toast(`📦 翻找街区废品箱：获得 🪙金币 +${g}`);
        } else if(roll < 0.75){
          const m = 6 + Math.floor(Math.random()*9);
          State.expMedals += m; toast(`📦 翻找街区废品箱：获得 🏅特训徽章 +${m}`);
        } else if(roll < 0.90){
          State.gold += 12; toast('📦 翻找街区废品箱：只有几枚旧螺丝，变卖获得 🪙金币 +12');
        } else {
          const tpl = ACCESSORY_TEMPLATES.filter(a=>a.rarity==='R')[Math.floor(Math.random()*2)];
          State.accessories.push({ uid:'acc_'+Date.now(), ...tpl, level:1 });
          toast(`📦 运气不错！在补给箱角落发现了【${tpl.name}】`);
        }
        saveState();
      }
      if(!crate.active && Date.now() > crate.respawnAt){
        crate.x = W*(0.32+Math.random()*0.36); crate.y = H*(0.35+Math.random()*0.32); crate.active = true;
      }

      activeZone = null;
      for(const z of zones){ if(Math.hypot(player.x-z.x, player.y-z.y) < z.r + 18){ activeZone = z; break; } }
      const prompt = document.getElementById('btnCityInteract');
      if(activeZone){ prompt.style.display = 'block'; prompt.textContent = `按 [空格] 或点击进入：${activeZone.label}`; }
      else prompt.style.display = 'none';
    }

    function draw(){
      ctx.clearRect(0,0,W,H);
      ctx.fillStyle = '#14151f'; ctx.fillRect(0,0,W,H);
      ctx.fillStyle = '#222434';
      ctx.fillRect(0, H*0.44, W, H*0.14);
      ctx.fillRect(W*0.43, 0, W*0.14, H);
      ctx.strokeStyle = '#ffd600'; ctx.setLineDash([16,14]); ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(0,H*0.51); ctx.lineTo(W,H*0.51); ctx.moveTo(W*0.50,0); ctx.lineTo(W*0.50,H); ctx.stroke();
      ctx.setLineDash([]);

      zones.forEach(z=>{
        const isNear = activeZone && activeZone.id === z.id;
        ctx.save();
        ctx.fillStyle = '#050507'; ctx.fillRect(z.x-58, z.y-32, 120, 68);
        ctx.fillStyle = isNear ? z.color : '#1e1f2d';
        ctx.strokeStyle = isNear ? '#fff' : z.color;
        ctx.lineWidth = isNear ? 4 : 3;
        ctx.fillRect(z.x-62, z.y-36, 120, 68); ctx.strokeRect(z.x-62, z.y-36, 120, 68);
        ctx.fillStyle = isNear ? '#050507' : '#fff'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText(z.label, z.x-2, z.y-6);
        ctx.fillStyle = isNear ? '#111' : z.color; ctx.font = 'bold 10px sans-serif';
        ctx.fillText(z.sub, z.x-2, z.y+14);
        ctx.restore();
      });

      if(crate.active){
        ctx.save(); ctx.fillStyle = '#ffd600'; ctx.strokeStyle = '#000'; ctx.lineWidth = 3;
        ctx.fillRect(crate.x-14, crate.y-14, 28, 28); ctx.strokeRect(crate.x-14, crate.y-14, 28, 28);
        ctx.fillStyle = '#000'; ctx.font = '16px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText('📦', crate.x, crate.y+6); ctx.restore();
      }

      const lead = HERO_MAP[State.leadHero] || HERO_ROSTER[0];
      ctx.save(); ctx.translate(player.x, player.y);
      ctx.strokeStyle = lead.color; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.ellipse(0,18,22,9,0,0,Math.PI*2); ctx.stroke();
      ctx.fillStyle = lead.color; ctx.strokeStyle = '#000'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(-14*player.facing,-8); ctx.lineTo(-22*player.facing,16); ctx.lineTo(10*player.facing,16); ctx.lineTo(12*player.facing,-8); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#ffe0bd'; ctx.beginPath(); ctx.arc(0,-16,13,0,Math.PI*2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = 'rgba(0,0,0,0.85)'; ctx.fillRect(-56,-44,112,17);
      ctx.fillStyle = '#ffd600'; ctx.font = 'bold 10px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(lead.name, 0, -32);
      ctx.restore();
    }

    function init(){
      resize(); window.addEventListener('resize', resize);
      window.addEventListener('keydown', e=>{
        keys[e.code] = true;
        if((e.code==='Space'||e.code==='KeyE') && activeZone && !document.getElementById('mainModal').classList.contains('open')){
          e.preventDefault(); activeZone.action();
        }
      });
      window.addEventListener('keyup', e=>{ keys[e.code] = false; });
      canvas.addEventListener('pointerdown', e=>{
        const rect = canvas.getBoundingClientRect();
        const cx = e.clientX - rect.left, cy = e.clientY - rect.top;
        for(const z of zones){
          if(Math.hypot(cx-z.x, cy-z.y) < 58 && Math.hypot(player.x-z.x, player.y-z.y) < z.r + 32){ z.action(); return; }
        }
        player.targetX = cx; player.targetY = cy;
      });
      document.querySelectorAll('#mobileDpad .dpad-btn').forEach(btn=>{
        const dir = btn.dataset.dir;
        btn.addEventListener('pointerdown', e=>{ e.preventDefault(); keys[dir]=true; });
        btn.addEventListener('pointerup', ()=>keys[dir]=false);
        btn.addEventListener('pointerleave', ()=>keys[dir]=false);
      });
      document.getElementById('btnCityInteract').addEventListener('click', ()=>{ if(activeZone) activeZone.action(); });
      let last = performance.now();
      function loop(now){ const dt = Math.min(0.05,(now-last)/1000); last = now; update(dt); draw(); requestAnimationFrame(loop); }
      requestAnimationFrame(loop);
    }
    return { init, resize };
  })();

  function spawnVfx(x, y, color, count=22, speed=250){
    for(let i=0;i<count;i++){
      const ang = Math.random()*Math.PI*2, spd = (0.3+Math.random()*0.9)*speed;
      particles.push({ x, y, vx:Math.cos(ang)*spd, vy:Math.sin(ang)*spd, life:0.5+Math.random()*0.3, maxLife:0.8, size:4+Math.random()*5, color });

  function floatText(targetEl, text, cls=''){

    const d = document.createElement('div'); d.className = 'dmg-float ' + cls; d.textContent = text;

  (function vfxLoop(){
    const bw = vfxCanvas.parentElement?.clientWidth || window.innerWidth;
    const bh = vfxCanvas.parentElement?.clientHeight || window.innerHeight;
    if(vfxCanvas.width !== bw || vfxCanvas.height !== bh){ vfxCanvas.width = bw; vfxCanvas.height = bh; }
    vfxCtx.clearRect(0,0,bw,bh);
    for(let i=particles.length-1;i>=0;i--){
      const p = particles[i]; p.x += p.vx*0.016; p.y += p.vy*0.016; p.life -= 0.016;
      if(p.life<=0){ particles.splice(i,1); continue; }
      vfxCtx.globalAlpha = Math.max(0, p.life/p.maxLife);
      vfxCtx.fillStyle = p.color; vfxCtx.fillRect(p.x, p.y, p.size, p.size);
    }
    vfxCtx.globalAlpha = 1;
    requestAnimationFrame(vfxLoop);
  })();

      def: row==='front' ? Math.round(st.def*1.15) : st.def, crit:st.crit, sigActive:st.sigActive,
      shield:0, taunt:0, critBuff:0
    };

        { id:'e_f3', name:'前锋怪人·乙', row:'front', maxHp:mHp, hp:mHp, atk:mAtk, portrait:BOSS_SVGS.seaking, burn:0, stun:0, slow:0 },

  function logBattle(msg){
    const el = document.getElementById('battleLog');
    const line = document.createElement('div'); line.textContent = msg;
    el.appendChild(line); el.scrollTop = el.scrollHeight;
  }

  function renderUnit6(u, domId, isActive, isEnemy){
    const hpPct = Math.max(0, Math.round(u.hp/u.maxHp*100));
    const shPct = Math.min(100, Math.round((u.shield||0)/u.maxHp*100));
    return `
      <div class="unit-6 ${isActive?'active-turn':''} ${u.hp<=0?'dead':''} ${u.isBoss?'boss-unit':''}" id="${domId}">
        <img src="${u.portrait}" alt="${u.name}">
        <div class="unit-6-info">
          <div class="unit-6-name">${u.name}</div>
          <div class="hp-bar">
            <div class="hp-fill ${isEnemy?'enemy':''}" style="width:${hpPct}%"></div>
            ${shPct>0?`<div class="shield-fill" style="width:${shPct}%"></div>`:''}
          </div>
          <div class="unit-6-sub">
            <span>${u.hp}/${u.maxHp}</span>
            <span>${u.stun>0?'💫震慑':u.burn>0?'🔥灼烧':u.taunt>0?'🛡️嘲讽':''}</span>
          </div>
        </div>
      </div>`;
  }

  function renderBattle(){
    if(!Battle) return;
    document.getElementById('battleThreatBadge').textContent = Battle.stageTitle;
    const sp = Math.min(100, Math.round(Battle.saitama));
    document.getElementById('saitamaBarFill').style.width = sp + '%';
    document.getElementById('saitamaBarTxt').textContent = sp>=100 ? '破晓降临就绪！' : `充能 ${sp}%`;
    document.getElementById('btnSaitamaStrike').style.display = sp>=100 ? 'inline-flex' : 'none';

    const bondEl = document.getElementById('battleBondStrip');
    bondEl.innerHTML = Battle.bonds.active.length
      ? Battle.bonds.active.map(b=>`<span class="bond-pill">🔗 ${b.name}: ${b.desc}</span>`).join('')
      : '<span class="bond-pill" style="opacity:.6">提示：上阵同阵营/同职业英雄可激活强力 6v6 羁绊</span>';

    document.getElementById('allyBackCol').innerHTML = Battle.allies.filter(u=>u.row==='back').map(u=>renderUnit6(u,'ally_'+Battle.allies.indexOf(u), Battle.allies[Battle.turnIndex]===u, false)).join('');
    document.getElementById('allyFrontCol').innerHTML = Battle.allies.filter(u=>u.row==='front').map(u=>renderUnit6(u,'ally_'+Battle.allies.indexOf(u), Battle.allies[Battle.turnIndex]===u, false)).join('');
    document.getElementById('enemyFrontCol').innerHTML = Battle.enemies.filter(u=>u.row==='front').map(u=>renderUnit6(u,'enemy_'+Battle.enemies.indexOf(u), false, true)).join('');
    document.getElementById('enemyBackCol').innerHTML = Battle.enemies.filter(u=>u.row==='back').map(u=>renderUnit6(u,'enemy_'+Battle.enemies.indexOf(u), false, true)).join('');

    document.getElementById('energyNum').textContent = Battle.energy;
    document.getElementById('energyMax').textContent = Battle.maxEnergy;
    const orbs = document.getElementById('energyOrbs'); orbs.innerHTML = '';
    for(let i=0;i<Battle.maxEnergy;i++){
      const o = document.createElement('div'); o.className = 'orb' + (i<Battle.energy?' on':''); orbs.appendChild(o);
    }

    const activeHero = Battle.allies[Battle.turnIndex];
    const sRow = document.getElementById('skillsRow'); sRow.innerHTML = '';
    if(activeHero && activeHero.hp > 0){
      const def = HERO_MAP[activeHero.id];
      document.getElementById('turnIndicator').textContent = `轮到：${activeHero.name} (${activeHero.row==='front'?'前排':'后排'})`;
      def.skills.forEach((sk, idx)=>{
        const btn = document.createElement('button');
        btn.className = 'skill-btn' + (idx===2?' ult':'');
        btn.disabled = Battle.busy || (sk.cost > 0 && sk.cost > Battle.energy);
        btn.innerHTML = `<div class="skill-head"><span>${sk.name}</span><span class="skill-cost">${sk.cost<0?'+1 能量':`消耗 ${sk.cost} 能量`}</span></div><div class="skill-desc">${sk.desc}</div>`;
        btn.addEventListener('click', ()=>useSkill(idx));
        sRow.appendChild(btn);
      });
    }
  }

  function pickEnemyTarget(isUlt){
    const frontAlive = Battle.enemies.filter(e=>e.hp>0 && e.row==='front');
    const allAlive = Battle.enemies.filter(e=>e.hp>0);
    if(allAlive.length === 0) return null;
    if(isUlt) return allAlive[Math.floor(Math.random()*allAlive.length)];
    return frontAlive.length > 0 ? frontAlive[0] : allAlive[0];
  }

  function useSkill(skillIdx){
    if(!Battle || Battle.busy) return;
    const h = Battle.allies[Battle.turnIndex];
    const def = HERO_MAP[h.id];
    const sk = def.skills[skillIdx];
    if(sk.cost > 0 && Battle.energy < sk.cost) return;

    Battle.busy = true;
    Battle.energy = Math.min(Battle.maxEnergy, Math.max(0, Battle.energy - sk.cost));

    const runAction = () => {
      if(sk.mult){
        const targets = skillIdx===2 ? Battle.enemies.filter(e=>e.hp>0).slice(0,3) : [pickEnemyTarget(false)].filter(Boolean);
        targets.forEach(tgt=>{
          let dmg = h.atk * sk.mult * Battle.rogue.atkMult * (skillIdx===2 && targets.length>1 ? 0.65 : 1);
          const isCrit = Math.random()*100 < (h.crit + h.critBuff + Battle.rogue.critBonus);
          if(isCrit){ dmg *= 1.55; AudioFX.crit(); } else AudioFX.hit();
          const finalDmg = Math.max(1, Math.round(dmg));
          tgt.hp = Math.max(0, tgt.hp - finalDmg);
          const tEl = document.getElementById('enemy_' + Battle.enemies.indexOf(tgt));
          if(tEl){
            tEl.classList.add('hit-flash'); setTimeout(()=>tEl.classList.remove('hit-flash'), 160);
            const r = tEl.getBoundingClientRect();
            spawnVfx(r.left+r.width/2, r.top+r.height/2, isCrit?'#ffd600':h.color, isCrit?26:14, 240);
            floatText(tEl, (isCrit?'暴击 ':'')+'-'+finalDmg+(isCrit?'!':''), isCrit?'crit':'');
          }
          if(sk.burn) tgt.burn = Math.max(tgt.burn, sk.burn);
          if(sk.slow) tgt.slow = Math.max(tgt.slow, sk.slow);
          if(sk.stunChance && Math.random()<sk.stunChance) tgt.stun = 1;
        });
        triggerShake();
        logBattle(`⚡ ${h.name} 施放【${sk.name}】打击敌阵！`);
      }

      if(sk.type === 'shield'){
        const sh = Math.round(h.maxHp * sk.shieldMult);
        Battle.allies.forEach(a=>{ if(a.hp>0) a.shield += sh; });
        h.taunt = sk.taunt; AudioFX.hit();
        logBattle(`🛡️ ${h.name} 展开护盾，全队获得 ${sh} 护盾！`);
      }
      if(sk.type === 'support'){
        Battle.allies.forEach(a=>{ if(a.hp>0) a.hp = Math.min(a.maxHp, a.hp + Math.round(a.maxHp*sk.healMult)); });
        logBattle(`💚 ${h.name} 为全队恢复生命！`);
      }
      if(sk.type === 'king' || sk.type === 'ult_king'){
        AudioFX.king(); triggerShake();
        Battle.enemies.forEach(e=>{ if(e.hp>0 && Math.random()<sk.stunChance) e.stun = 1; });
        if(sk.type==='ult_king') Battle.allies.forEach(a=>{ if(a.hp>0) a.hp=Math.min(a.maxHp, a.hp+Math.round(a.maxHp*0.18)); });
        logBattle(`👑 ${h.name} 发动【${sk.name}】，敌阵陷入剧烈震慑！`);
      }

      const boost = (sk.saitamaBoost || 8) * Battle.rogue.saitamaSpeed;
      Battle.saitama = Math.min(100, Battle.saitama + boost);
      if(sk.selfCritUp) h.critBuff = sk.selfCritUp;

      renderBattle();
      if(Battle.enemies.every(e=>e.hp<=0)){ setTimeout(handleVictory, 420); return; }
      setTimeout(advanceTurn, 360);
    };

    if(skillIdx === 2){ showCutIn(def, sk.quote); setTimeout(runAction, 620); }
    else runAction();
  }

  document.getElementById('btnSaitamaStrike').addEventListener('click', ()=>{
    if(!Battle || Battle.busy || Battle.saitama < 100) return;
    Battle.busy = true; Battle.saitama = 0;
    showCutIn(HERO_MAP.ur_lingfeng, '破晓终焉裁决！！');
    setTimeout(()=>{
      triggerShake(); AudioFX.ult();
      Battle.enemies.forEach((e,idx)=>{
        if(e.hp<=0) return;
        const dmg = Math.max(900, Math.round(e.maxHp*0.48));
        e.hp = Math.max(0, e.hp - dmg);
        const el = document.getElementById('enemy_'+idx);
        floatText(el, `终焉 -${dmg}!!`, 'crit');
      });
      logBattle('💥 破晓降临全屏裁决，敌方全阵遭受毁灭性真伤！');
      renderBattle();
      if(Battle.enemies.every(e=>e.hp<=0)) setTimeout(handleVictory, 450);
      else { Battle.busy = false; renderBattle(); }
    }, 640);
  });

  function advanceTurn(){
    if(!Battle) return;
    let next = Battle.turnIndex + 1;
    while(next < Battle.allies.length && Battle.allies[next].hp <= 0) next++;
    if(next < Battle.allies.length){ Battle.turnIndex = next; Battle.busy = false; renderBattle(); }
    else enemyTurn();
  }

  function enemyTurn(){
    if(!Battle) return;
    let acted = 0;
    Battle.enemies.forEach((e, idx)=>{
      if(e.hp <= 0) return;
      if(e.burn > 0){
        const bd = Math.round(e.maxHp*0.05); e.hp = Math.max(0, e.hp-bd); e.burn--;
        if(e.hp<=0) return;
      }
      if(e.stun > 0){ e.stun--; return; }
      acted++;
      const aliveFront = Battle.allies.filter(a=>a.hp>0 && a.row==='front');
      const pool = aliveFront.length > 0 ? aliveFront : Battle.allies.filter(a=>a.hp>0);
      if(pool.length === 0) return;
      const taunter = pool.find(a=>a.taunt>0);
      const tgt = taunter || pool[Math.floor(Math.random()*pool.length)];
      let dmg = Math.max(12, Math.round(e.atk*(e.slow>0?0.75:1) - tgt.def*0.35));
      if(tgt.shield > 0){ const ab = Math.min(tgt.shield, dmg); tgt.shield -= ab; dmg -= ab; }
      tgt.hp = Math.max(0, tgt.hp - dmg);
      if(e.slow>0) e.slow--;
    });
    if(acted>0){ AudioFX.hit(); triggerShake(); logBattle(`💥 敌方 ${acted} 名单位发动反击！`); }
    else logBattle(`💫 敌方全员被震慑或无法行动！`);

    Battle.allies.forEach(a=>{ if(a.taunt>0) a.taunt--; a.critBuff=0; });

    if(Battle.enemies.every(e=>e.hp<=0)){ renderBattle(); setTimeout(handleVictory, 400); return; }
    if(Battle.allies.every(a=>a.hp<=0)){
      logBattle('💀 我方 6 人小队全员力竭，撤回苍穹都市...');
      setTimeout(()=>{ Battle=null; document.getElementById('battleView').style.display='none'; toast('战斗失利，调整前后排羁绊或升级英雄后再战！'); }, 800);
      return;
    }

    Battle.energy = Math.min(Battle.maxEnergy, Battle.energy + 3 + Battle.rogue.extraEnergy);
    Battle.turnIndex = Battle.allies.findIndex(a=>a.hp>0);
    Battle.busy = false;
    renderBattle();
  }

  function handleVictory(){
    const r = Battle.rewards;
    if(Battle.mode === 'pvp'){
      State.honor += r.honor; State.gold += r.gold; State.diamonds += r.dia; State.pvpWins++;
      saveState(); syncFirebaseScore();
      openModal('🏟️ 竞技场 6v6 胜利！', `
        <div style="font-weight:900;color:var(--yellow);margin-bottom:10px">成功击败【${Battle.oppName}】！</div>
        <div style="font-size:13px;margin-bottom:14px">获得：🎖️荣誉币 +${r.honor} | 🪙金币 +${r.gold} | 💎钻石 +${r.dia}</div>
        <button class="comic-btn" onclick="window.__exitBattle()">返回苍穹都市</button>`);
      return;
    }
    if(Battle.mode === 'alliance'){
      State.diamonds += r.dia; State.gold += r.gold; State.expMedals += r.exp; State.allianceContrib += 150;
      saveState(); syncFirebaseScore();
      openModal('🏰 联盟共斗讨伐成功！', `
        <div style="font-size:13px;margin-bottom:14px">联盟贡献 +150 | 💎钻石 +${r.dia} | 🪙金币 +${r.gold} | 🏅徽章 +${r.exp}</div>
        <button class="comic-btn" onclick="window.__exitBattle()">返回苍穹都市</button>`);
      return;
    }
    const isFirst = Battle.wave >= State.highestWave;
    const diaGain = isFirst ? r.dia : Math.round(r.dia*0.25);
    State.gold += r.gold; State.expMedals += r.exp; State.diamonds += diaGain; State.totalWins++;
    if(Battle.wave === State.highestWave) State.highestWave++;
    saveState(); syncFirebaseScore();

    const shuffled = [...ROGUE_CARDS].sort(()=>Math.random()-0.5).slice(0,3);
    openModal(`🏆 击溃灾害！英雄协会补给`, `
      <div style="margin-bottom:10px;font-weight:800;color:var(--yellow)">战利品：🪙+${r.gold} | 🏅+${r.exp} | 💎+${diaGain} ${isFirst?'(首通!)':''}</div>
      <div class="grid-cards">
        ${shuffled.map((c,i)=>`<div class="item-card ssr"><div style="font-weight:900;color:var(--yellow)">${c.title}</div><div style="font-size:12px;flex:1">${c.desc}</div><button class="comic-btn" onclick="window.__pickRogue(${i})">选择并继续</button></div>`).join('')}
      </div>
      <div style="margin-top:10px;text-align:right"><button class="comic-btn dark" onclick="window.__exitBattle()">先回都市</button></div>`);
    window.__rogueChoices = shuffled;
  }
  window.__pickRogue = (i) => {
    const c = window.__rogueChoices[i];
    if(c && Battle){
      c.apply(Battle); closeModal();
      const nw = Battle.wave + 1;
      const prevA = Battle.allies, prevR = Battle.rogue, prevE = Battle.energy;
      startBattle(nw, 'pve');
      Battle.allies.forEach((a,idx)=>{ if(prevA[idx] && prevA[idx].hp>0) a.hp = Math.min(a.maxHp, prevA[idx].hp); });
      Battle.rogue = prevR; Battle.energy = prevE; renderBattle();
    }
  };
  window.__exitBattle = () => { closeModal(); Battle=null; document.getElementById('battleView').style.display='none'; };
  document.getElementById('btnRetreat').addEventListener('click', ()=>{ Battle=null; document.getElementById('battleView').style.display='none'; });

  function playGachaAnimation(results, onDone){
    const ov = document.getElementById('gachaAnimOverlay');
    const cv = document.getElementById('gachaAnimCanvas');
    const box = document.getElementById('gachaRevealBox');
    const ctx = cv.getContext('2d');
    ov.style.display = 'flex';
    box.style.display = 'none';
    cv.style.display = 'block';
    cv.width = window.innerWidth; cv.height = window.innerHeight;

    const hasUR = results.some(r=>r.rarity==='UR');
    const hasSR = results.some(r=>r.rarity==='SSR'||r.rarity==='SR');
    const meteorColor = hasUR ? '#ffd600' : hasSR ? '#b388ff' : '#00e5ff';

    let t = 0;
    const stars = Array.from({length:70}, ()=>({ x:Math.random()*cv.width, y:Math.random()*cv.height, s:1+Math.random()*2 }));
    function animFrame(){
      t += 0.022;
      ctx.fillStyle = 'rgba(4,4,10,0.35)';
      ctx.fillRect(0,0,cv.width,cv.height);
      stars.forEach(st=>{ ctx.fillStyle='#fff'; ctx.fillRect(st.x, st.y, st.s, st.s); });

      const sx = cv.width * (0.1 + t*0.75);
      const sy = cv.height * (0.12 + t*0.62);
      const grad = ctx.createLinearGradient(sx-120, sy-90, sx, sy);
      grad.addColorStop(0, 'transparent');
      grad.addColorStop(1, meteorColor);
      ctx.strokeStyle = grad; ctx.lineWidth = 10; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(sx-140, sy-105); ctx.lineTo(sx, sy); ctx.stroke();

      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(sx, sy, 12, 0, Math.PI*2); ctx.fill();

      if(t < 1.0){
        requestAnimationFrame(animFrame);
      } else {
        ctx.fillStyle = meteorColor;
        ctx.fillRect(0,0,cv.width,cv.height);
        setTimeout(()=>{
          cv.style.display = 'none';
          box.style.display = 'flex';
          showRevealCards(results, onDone);
        }, 180);
      }
    }
    AudioFX.gacha();
    requestAnimationFrame(animFrame);
  }

  function showRevealCards(results, onDone){
    const box = document.getElementById('gachaRevealBox');
    let idx = 0;
    function renderStep(){
      const r = results[idx];
      const isLast = idx >= results.length - 1;
      box.innerHTML = `
        <div style="font-size:12px;color:var(--muted);font-weight:800">祈愿结果 (${idx+1} / ${results.length})</div>
        <div class="gacha-splash-card" style="border-color:${r.rarity==='UR'?'#ffd600':r.rarity==='SSR'?'#b388ff':'#00e5ff'}">
          ${r.img ? `<img src="${r.img}" style="width:180px;height:240px;object-fit:cover;border:3px solid #000;margin-bottom:8px">` : `<div style="width:180px;height:200px;background:#111;display:flex;align-items:center;justify-content:center;font-size:56px;margin:0 auto 8px">💍</div>`}
          <div><span class="tag ${r.rarity.toLowerCase()}">${r.rarity}</span></div>
          <div style="font-size:18px;font-weight:900;margin-top:4px;color:#fff">${r.name}</div>
          <div style="font-size:12px;color:var(--yellow);margin-top:3px">${r.sub}</div>
        </div>
        <div style="display:flex;gap:10px">
          ${!isLast ? `<button class="comic-btn" id="btnNextReveal">下一个 ▶</button>` : ''}
          <button class="comic-btn red" id="btnSkipReveal">${isLast ? '收下全部' : '跳过动画查看总览'}</button>
        </div>`;
      document.getElementById('btnNextReveal')?.addEventListener('click', ()=>{ idx++; AudioFX.hit(); renderStep(); });
      document.getElementById('btnSkipReveal').addEventListener('click', ()=>{
        document.getElementById('gachaAnimOverlay').style.display = 'none';
        onDone();
      });
    }
    renderStep();
  }

  window.__pull = (tab, count) => {
    const cost = tab==='wp'?140:160;
    const tKey = tab==='lim'?'limTickets':'stdTickets';
    const useTix = Math.min(State[tKey], count);
    const needDia = (count - useTix) * cost;
    if(State.diamonds < needDia){ toast(`💎 钻石不足！还需 ${needDia - State.diamonds} 钻石`); return; }
    State[tKey] -= useTix; State.diamonds -= needDia;

    const permUR = HERO_ROSTER.filter(h=>h.rarity==='UR' && !h.limited);
    const limUR  = HERO_ROSTER.filter(h=>h.rarity==='UR' && h.limited);
    const ssrPool = HERO_ROSTER.filter(h=>h.rarity==='SSR');
    const srPool = HERO_ROSTER.filter(h=>h.rarity==='SR');
    const rPool = HERO_ROSTER.filter(h=>h.rarity==='R');

    const res = [];
    let gotSsrOrHigher = false;
    for(let i=0;i<count;i++){
      if(tab === 'wp'){
        State.wpPity++;
        const urRate = State.wpPity >= 80 ? 1 : State.wpPity >= 63 ? 0.007 + (State.wpPity - 62)*0.055 : 0.007;
        if(Math.random() < urRate){
          State.wpPity = 0; gotSsrOrHigher = true;
          const keys = Object.keys(WEAPON_DEFS);
          const wd = WEAPON_DEFS[keys[Math.floor(Math.random()*keys.length)]];
          State.weapons.push({ uid:'wp_'+Date.now()+'_'+i, defId:wd.id, level:1 });
          res.push({ rarity:wd.rarity, name:wd.name, sub:wd.passive, img:getHeroPortrait(HERO_MAP[wd.hero]) });
        } else {
          const isHighAcc = (i===count-1 && !gotSsrOrHigher) || Math.random() < 0.06;
          const pool = isHighAcc ? ACCESSORY_TEMPLATES.filter(a=>a.rarity!=='R') : ACCESSORY_TEMPLATES;
          const tpl = pool[Math.floor(Math.random()*pool.length)];
          if(tpl.rarity!=='R') gotSsrOrHigher = true;
          State.accessories.push({ uid:'acc_'+Date.now()+'_'+i, ...tpl, level:1 });
          res.push({ rarity:tpl.rarity, name:tpl.name, sub:`配饰 攻+${tpl.atk} 血+${tpl.hp}` });
        }
      } else {
        const pKey = tab==='lim'?'limPity':'stdPity';
        State[pKey]++;
        const p = State[pKey];
        // Genshin 0.6% base, soft pity from 74 (+6% per pull), hard pity at 90
        const urProb = p >= 90 ? 1.0 : (p >= 74 ? 0.006 + (p - 73)*0.06 : 0.006);
        const ssrProb = (count===10 && i===9 && !gotSsrOrHigher) ? 1.0 : 0.051;
        const r = Math.random();
        let pick = null;

        if(r < urProb){
          State[pKey] = 0; gotSsrOrHigher = true;
          if(tab === 'lim'){
            if(State.limGuaranteed || Math.random() < 0.5){
              State.limGuaranteed = false;
              pick = limUR[Math.floor(Math.random()*limUR.length)];
            } else {
              State.limGuaranteed = true;
              pick = permUR[Math.floor(Math.random()*permUR.length)];
            }
          } else {
            pick = permUR[Math.floor(Math.random()*permUR.length)];
          }
        } else if(r < urProb + ssrProb){
          gotSsrOrHigher = true;
          pick = ssrPool[Math.floor(Math.random()*ssrPool.length)];
        } else if(r < urProb + ssrProb + 0.243){
          pick = srPool[Math.floor(Math.random()*srPool.length)];
        } else {
          pick = rPool[Math.floor(Math.random()*rPool.length)];
        }

        let note = `${pick.faction} · ${pick.cls}`;
        if(State.heroes[pick.id]){ State.heroes[pick.id].shards += 20; note = '已拥有→20碎片'; }
        else State.heroes[pick.id] = { level:1, stars:1, shards:0, weaponId:null, accCore:null, accCharm:null };
        res.push({ rarity:pick.rarity, name:pick.name, sub:note, img:getHeroPortrait(pick) });
      }
    }

    saveState();
    playGachaAnimation(res, ()=>{
      openGachaModal(tab);
      document.getElementById('gachaRes').innerHTML = res.map(x=>`
        <div class="item-card ${x.rarity.toLowerCase()}">
          <div class="item-card-top">
            ${x.img?`<img src="${x.img}" alt="">`:`<div style="width:52px;height:68px;background:#111;border:2px solid #000;display:flex;align-items:center;justify-content:center;font-size:24px">💍</div>`}
            <div><span class="tag ${x.rarity.toLowerCase()}">${x.rarity}</span><div style="font-weight:900;font-size:12px;margin-top:2px">${x.name}</div><div style="font-size:10px;color:var(--yellow)">${x.sub}</div></div>
          </div>
        </div>`).join('');
    });
  };

          <div style="font-weight:900;color:var(--cyan)">${r.score} 分</div>
        </div>`).join('');
    }catch(e){ document.getElementById('rankListBox').textContent='读取全服榜失败。'; }
  }

  // Bounties
  const BOUNTIES = [
    { id:'b1', title:'击溃狼级灾害', check:()=>State.totalWins>=1, dia:100, tix:1 },
    { id:'b2', title:'收集 10 名不同英雄', check:()=>Object.keys(State.heroes).length>=10, dia:160, lim:1 },
    { id:'b3', title:'在竞技场获胜 1 次', check:()=>State.pvpWins>=1, dia:150, lim:1 },
    { id:'b4', title:'解锁第 4 关龙级灾害', check:()=>State.highestWave>=4, dia:240, lim:2 }
  ];
  function openBountyModal(){
    openModal('📋 英雄协会赏金委托', `<div class="grid-cards">${BOUNTIES.map(b=>{
      const ok=b.check(), cl=!!State.claimedBounties[b.id];
      return `<div class="item-card ${ok&&!cl?'ssr':''}"><b>${b.title}</b><div style="font-size:12px;color:var(--yellow)">奖励：💎${b.dia}${b.tix?` + 🎫${b.tix}`:''}${b.lim?` + 🌟${b.lim}`:''}</div><button class="comic-btn" ${(!ok||cl)?'disabled':''} onclick="window.__clB('${b.id}')">${cl?'已领取':ok?'领取':'未达成'}</button></div>`;
    }).join('')}</div>`);
  }
  window.__clB = (id) => {
    const b = BOUNTIES.find(x=>x.id===id); if(!b||!b.check()||State.claimedBounties[id]) return;
    State.claimedBounties[id]=true; State.diamonds+=b.dia; if(b.tix)State.stdTickets+=b.tix; if(b.lim)State.limTickets+=b.lim;
    saveState(); openBountyModal(); toast('赏金领取成功！');
  };

  function openModal(title, html){ document.getElementById('modalTitle').textContent=title; document.getElementById('modalBody').innerHTML=html; document.getElementById('mainModal').classList.add('open'); }
  function closeModal(){ document.getElementById('mainModal').classList.remove('open'); }
  document.getElementById('btnCloseModal').addEventListener('click', closeModal);
  document.getElementById('btnGacha').addEventListener('click', ()=>openGachaModal('std'));
  document.getElementById('btnHeroes').addEventListener('click', ()=>openHeroesModal('ALL'));
  document.getElementById('btnGear').addEventListener('click', ()=>openGearModal());
  document.getElementById('btnArena').addEventListener('click', openArenaModal);
  document.getElementById('btnAlliance').addEventListener('click', openAllianceModal);
  document.getElementById('btnRank').addEventListener('click', openRankModal);
  document.getElementById('btnBounty').addEventListener('click', openBountyModal);
  document.getElementById('btnSwitchLead').addEventListener('click', ()=>openHeroesModal('ALL'));
  document.getElementById('btnQuickBattle').addEventListener('click', ()=>startBattle(State.highestWave,'pve'));
  document.getElementById('btnAudioToggle').addEventListener('click', ()=>{ const on=AudioFX.toggle(); document.getElementById('btnAudioToggle').textContent=on?'🔊 音效':'🔇 静音'; });

  window.onload = () => { renderTopBar(); City.init(); };
})();
</script>
</body>
</html>
